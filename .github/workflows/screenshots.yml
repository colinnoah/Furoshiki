name: Screenshots

# Renders the README screenshots on a real Mac: the app runs in showcase mode
# and each window is captured. The PNGs come back as an artifact to review
# and commit under docs/assets/readme/screenshots.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Sources/Furoshiki/Support/ReadmeShowcase.swift"
      - "Tools/readme-screenshots.sh"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

jobs:
  capture:
    name: Capture README screenshots
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Capture
        run: ./Tools/readme-screenshots.sh build/readme-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-screenshots
          path: build/readme-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
