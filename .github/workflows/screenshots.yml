name: Screenshots

# Renders the README screenshots on a real Mac: the app runs in showcase mode
# and each window is captured. The PNGs are kept as an artifact and, on a
# pull request from this repository, committed to its branch under
# docs/assets/readme/screenshots, where they show in the diff.
#
# It runs only when asked: add the label "update-screenshots" to a pull
# request, or start it by hand. GitHub holds CI on the commit it adds until
# someone approves the run or pushes again.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture README screenshots
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-screenshots'
    runs-on: macos-26
    timeout-minutes: 40
    # Write access is used only by the last step, on pull requests from this
    # repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The branch itself rather than the merge commit, so the captures
          # can be committed onto it.
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false

      - name: Build
        run: ./build.sh

      # The runner has a mouse and no trackpad, so macOS would draw every
      # scroll bar permanently; most Macs show them only while scrolling.
      - name: Capture
        run: |
          defaults write -g AppleShowScrollBars -string WhenScrolling
          ./Tools/readme-screenshots.sh build/readme-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-screenshots
          path: build/readme-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

      # A push made with the workflow token starts no new runs, so this
      # cannot loop.
      - name: Commit screenshots to the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p docs/assets/readme/screenshots
          cp build/readme-screenshots/*.png docs/assets/readme/screenshots/
          git add docs/assets/readme/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update README screenshots"
          # The branch may have moved on while the app was being built; put
          # this one new commit on top of it.
          git fetch --quiet origin "$HEAD_REF"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              rebase FETCH_HEAD
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
